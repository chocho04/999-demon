<style>
/* Layout: one full-screen game. Canvas letterboxed in the middle, HUD on top, touch buttons in the bottom corners. Single look: orange world, navy blocks. */
:root{
  --orange:#F39032;
  --orange-2:#E8731F;
  --navy:#1A2747;
  --navy-2:#2A3B66;
  --cream:#FFF4E2;
  --lava:#E3341F;
  --portal:#7B3FE4;
  --f-title:"Russo One", "Rubik", system-ui, sans-serif;
  --f-ui:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--navy);color:var(--cream);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%, #22325a, var(--navy) 70%)}
#wrap{position:relative}
canvas{display:block;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35)}

.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
.hud .pill{background:rgba(26,39,71,.85);color:var(--cream);border-radius:999px;padding:7px 12px;font:700 13px/1 var(--f-ui);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hud .pill b{font:800 14px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.hud .sp{flex:1}
.hud button{pointer-events:auto;width:38px;height:34px;border-radius:10px;border:0;background:rgba(26,39,71,.85);color:var(--cream);display:grid;place-items:center;padding:0}
.hud button svg{width:20px;height:20px}
.hud .fs .i{display:none}.hud .fs.on .i{display:inline}.hud .fs.on .o{display:none}
.hud .snd .x{display:none}.hud .snd.off .x{display:inline}.hud .snd.off .w{display:none}

.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:14px;z-index:5}
.pad.l{left:max(16px,env(safe-area-inset-left,0px))}
.pad.r{right:max(16px,env(safe-area-inset-right,0px))}
.pad button{width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,244,226,.55);background:rgba(26,39,71,.55);color:var(--cream);display:grid;place-items:center;padding:0;touch-action:none}
.pad button.on{background:rgba(26,39,71,.9);border-color:var(--cream);transform:scale(.95)}
.pad button svg{width:34px;height:34px}
.pad.r button{width:90px;height:90px}

.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;background:var(--orange);color:var(--navy);text-align:center;overflow-y:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen h1{margin:0;font:400 clamp(40px,min(16vw,19vh),120px)/.9 var(--f-title);letter-spacing:.02em;color:var(--navy);text-shadow:0 6px 0 rgba(0,0,0,.12)}
.screen h1 span{display:block;font-size:.55em;letter-spacing:.18em}
.screen h2{margin:0;font:400 clamp(26px,7vw,40px)/1.1 var(--f-title);color:var(--navy)}
.screen p{margin:0;font:500 16px/1.4 var(--f-ui);max-width:34ch;text-wrap:balance}
@media (max-height:520px){.screen{gap:10px}.screen p{font-size:14px}.btn{padding:11px 28px;font-size:18px}}
.btn{border:0;border-radius:16px;background:var(--navy);color:var(--cream);font:400 22px/1 var(--f-title);padding:16px 34px;letter-spacing:.04em;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy);font-size:17px;padding:12px 22px}
.stats{font:700 15px var(--f-ui);display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:min(720px,100%)}
.world{border:0;border-radius:20px;background:var(--navy);color:var(--cream);padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.world b{font:400 24px/1 var(--f-title)}
.world span{font:500 14px/1.35 var(--f-ui);color:#C9D2EA}
.world em{font:700 13px var(--f-ui);font-style:normal;color:var(--orange)}
.world:disabled{opacity:.45;cursor:default}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(460px,100%)}
.lv{aspect-ratio:1;border:0;border-radius:14px;background:var(--navy);color:var(--cream);font:400 22px/1 var(--f-title);box-shadow:0 5px 0 rgba(0,0,0,.22);display:grid;place-items:center;position:relative}
.lv.done{background:var(--navy-2)}
.lv.done::after{content:"✓";position:absolute;right:6px;top:4px;font:800 12px var(--f-ui);color:var(--orange)}
.lv.long{background:#3B1A2E}
.lv:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:20;font:400 clamp(30px,8vw,56px)/1 var(--f-title);color:var(--navy);text-shadow:0 4px 0 rgba(255,244,226,.6);pointer-events:none;white-space:nowrap;transition:opacity .3s}
.rot{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;background:rgba(26,39,71,.85);color:var(--cream);border-radius:999px;padding:8px 14px;font:700 12px var(--f-ui);pointer-events:none;white-space:nowrap}
@media (pointer:fine){.pad{display:none}}
</style>

  const t = JSON.parse(JSON.stringify(tr));

function circleHit(cx, cy, r){

/* ================= PLAYER & LOOP ================= */
const keys = { l:false, r:false, j:false };

let loopN = 1;
function startLevel(w, l){
  if (mode !== "play" || cur.w !== w || cur.l !== l) loopN = 1;
  cur = { w, l };
  const desc = WORLDS[w].levels[l];
  const d0 = desc.gen ? desc.gen(loopN) : desc;
  L = build(d0);
  if (w < 3) addSecret(L, w, l, d0);
  P = { x:L.spawn.x, y:L.spawn.y, w:24, h:34, vx:0, vy:0, onGround:false, ground:null, coyote:0, face:1, walk:0, cool:0, dead:false };
  cam.x = camTarget();
  deadT = 0; winT = 0; parts = []; jumpBuf = 0; msg = null;
  $("hudLv").textContent = (w === 3 ? "Секретный мир" : "Мир " + (w + 1)) + " · " + (l + 1) + "/15" + (l === 14 && w < 3 ? " · длинный" : "");
  $("hudD").textContent = deaths;
  mode = "play";
  showScreen(null);
}
function say(text, t){ msg = { text, t:t || 1.1 }; }
function kill(why){
  if (!P.dead && winT <= 0){ if (why === "lava") SFX.sizzle(); else if (why === "crush" || why === "ball") SFX.thud(); }
  if (P.dead || winT > 0) return;
  P.dead = true; deadT = 0.75; deaths++; store.set("deaths", deaths); $("hudD").textContent = deaths;
  for (let i = 0; i < 18; i++) parts.push({ x:P.x + P.w/2, y:P.y + P.h/2, vx:(Math.random() - 0.5)*520, vy:-Math.random()*520, s:4 + Math.random()*6, t:0.9 });

}
function solids(){ return L.solids.filter(s => s.on); }

  const lo = P.x < 0 ? (L.minX || 0) : (L.camLo || 0);
  const hi = P.x + P.w > L.W ? (L.maxX || L.W) - VW : L.W - VW + (L.camHi || 0);
  return Math.max(lo, Math.min(P.x + P.w/2 - VW/2, hi));
}
function moveAxis(dx, dy){
  const list = solids();

}
function update(dt){
  L.time += dt;
  for (const e of L.ents) e.upd && e.upd(dt);
  for (const f of L.effects) f.t -= dt;
  L.effects = L.effects.filter(f => f.t > 0);
  if (msg){ msg.t -= dt; if (msg.t <= 0) msg = null; }
  for (const p of parts){ p.vy += G_*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.t -= dt; }
  parts = parts.filter(p => p.t > 0);

  if (P.dead){ deadT -= dt; if (deadT <= 0) startLevel(cur.w, cur.l); return; }
  if (winT > 0){ winT -= dt; P.alpha = Math.max(0, winT/0.6); if (winT <= 0) levelDone(); return; }

  // input
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  const slow = L.slowZone && pc() >= L.slowZone[0] && pc() <= L.slowZone[1] ? L.slowZone[2] : 1;
  const target = dir*SPEED*slow;
  if (P.stun > 0) P.stun -= dt; else P.vx += (target - P.vx)*Math.min(1, dt*18);
  if (dir) P.face = dir;
  P.cool = Math.max(0, P.cool - dt);
  P.coyote = P.onGround ? 0.09 : Math.max(0, P.coyote - dt);
  jumpBuf = Math.max(0, jumpBuf - dt);
  P.justJumped = false;
  if (jumpBuf > 0 && (P.onGround || P.coyote > 0)){
    const sup = L.superZone && pc() >= L.superZone[0] && pc() <= L.superZone[1];
    P.vy = sup ? -1500 : -JV; P.super = sup; P.onGround = false; P.coyote = 0; jumpBuf = 0; P.justJumped = true;
    if (sup) tone(200, 0.5, { to:1600, type:"sine", vol:0.09 }); else SFX.jump();
  }
  if (P.onGround) P.super = false;
  if (!keys.j && !P.super && !P.inGrav && P.vy < -260) P.vy = -260;
  const gz = L.grav && !L.flags.gravOff && pc() >= L.grav[0] && pc() <= L.grav[1];
  if (gz && !P.inGrav){ P.vy = 0; P.onGround = false; tone(700, 0.5, { to:200, type:"sine", vol:0.08 }); say("Гравитация вверх!"); }
  P.inGrav = gz;

  // move in small steps
  const steps = Math.ceil(Math.max(Math.abs(P.vx*dt), Math.abs(P.vy*dt))/8) || 1;

  // spikes
  for (const k of L.spikes){ if (k.up && (k.rise === undefined || k.rise > 0.5) && ov({ x:P.x + 4, y:P.y, w:P.w - 8, h:P.h }, { x:k.x + 4, y:k.down ? k.y : k.y + 4, w:k.w - 8, h:k.h })) kill("spike"); }
  if (P.y < -10 && L.spikes.some(k => k.down && k.up && P.x + P.w > k.x && P.x < k.x + k.w)) kill("spike");
  if (P.y > VH + 40) kill("fall");

  // door
  const D = L.door;
  if (D.vis && !L.locked && !D.fall && D.tx === null && ov({ x:P.x + 4, y:P.y + 4, w:P.w - 8, h:P.h - 8 }, { x:D.x + 8, y:D.y + 14, w:D.w - 16, h:D.h - 14 })){
    if (D.fake){
      D.fake = false; D.fall = false; D.vis = false; SFX.laugh(); say("Ха-ха! Не та дверь");
      const ft = L.ents.find(e => e.tr.t === "doorFake");
      L.effects.push({ x:D.x + 16, y:D.y + 30, t:0.5 });
      setTimeout(() => { if (!L || !ft) return; D.x = ft.real[0]*T + 4; D.y = (ft.real[1] || GY)*T - 60; D.vis = true; L.doorEvent = L.time; L.effects.push({ x:D.x + 16, y:D.y + 30, t:0.6 }); }, 650);
    } else if (!P.dead){ winT = 0.6; P.alpha = 1; SFX.win(); }
  }

}
function levelDone(){
  if (cur.w === 3){
    if (cur.l + 1 > progress4){ progress4 = cur.l + 1; store.set("progress4", progress4); }
    if (cur.l === 14){ mode = "msg"; showMsg("Секретный мир пройден!", "Ты настоящий повелитель 999 Demon! Смертей за всё время: " + deaths + ".", [["В меню", () => showScreen("scrTitle")]]); return; }
    toast("Пройдено!"); startLevel(3, cur.l + 1); return;
  }

  if (cur.l === 14){
    mode = "msg";
    if (cur.w === 2){
      showMsg("Ты победил 999 Demon!", "Все 45 уровней пройдены. Смертей за всё время: " + deaths + ". Секретных ключей: " + skeyCount() + "/45" + (secretOpen() ? " — секретный мир открыт!" : ". В каждом уровне есть тайная комната…"), [["В меню", () => showScreen("scrTitle")]]);
    } else {
      showMsg("Мир " + (cur.w + 1) + " пройден!", "Открыт мир " + (cur.w + 2) + ": «" + WORLDS[cur.w + 1].name + "».", [["Дальше", () => startLevel(cur.w + 1, 0)], ["К мирам", () => openWorlds()]]);
    }

/* ================= DRAW ================= */
const cv = $("cv"), ctx = cv.getContext("2d");
let scale = 1, DPR = 1;
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw;
  const availH = portrait ? vh - 140 : vh;
  scale = Math.min(vw/VW, availH/VH);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW*scale*DPR); cv.height = Math.round(VH*scale*DPR);
  cv.style.width = Math.round(VW*scale) + "px"; cv.style.height = Math.round(VH*scale) + "px";
  $("wrap").style.marginBottom = portrait ? "110px" : "0";
  const touch = matchMedia("(pointer:coarse)").matches;
  $("rot").hidden = !(portrait && touch && mode === "play");
}
window.addEventListener("resize", fit);

function drawBg(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  if (cur.w === 3){ g.addColorStop(0, "#B565D8"); g.addColorStop(1, "#6E2FA8"); } else { g.addColorStop(0, "#F7A548"); g.addColorStop(1, "#EB7A22"); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = "rgba(255,240,210,.12)";
  for (let i = 0; i < 6; i++){
    const x = ((i*211 - cam.x*0.25) % (VW + 200) + VW + 200) % (VW + 200) - 100;
    ctx.beginPath(); ctx.arc(x, 90 + (i % 3)*70, 40 + (i % 2)*24, 0, Math.PI*2); ctx.fill();
  }
}
function blockRect(s){
  const sh = s.shake ? (Math.random() - 0.5)*4 : 0;
  if (s.hidden){ ctx.fillStyle = "#5B2A9E"; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = "#C9A2FF"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.fillText("?", s.x + s.w/2, s.y + 29); return; }
  ctx.fillStyle = "#1A2747"; ctx.fillRect(s.x + sh, s.y, s.w, s.h);
  ctx.fillStyle = "#2A3B66"; ctx.fillRect(s.x + sh, s.y, s.w, Math.min(6, s.h));
}
function drawSpikes(k){
  const rise = k.rise === undefined ? 1 : k.rise; if (!k.up && !rise) return;
  const h = k.h*rise, n = Math.round(k.w/20);
  ctx.fillStyle = "#1A2747";
  for (let i = 0; i < n; i++){
    const x = k.x + i*20; ctx.beginPath();
    if (k.down){ ctx.moveTo(x, k.y); ctx.lineTo(x + 10, k.y + h); ctx.lineTo(x + 20, k.y); }
    else { ctx.moveTo(x, k.y + k.h); ctx.lineTo(x + 10, k.y + k.h - h); ctx.lineTo(x + 20, k.y + k.h); }
    ctx.closePath(); ctx.fill();
  }
}
function drawPortal(r, exit){
  const cx = r.x + r.w/2, cy = r.y + r.h/2, t = performance.now()/400;
  ctx.save();
  ctx.fillStyle = exit ? "rgba(123,63,228,.35)" : "rgba(123,63,228,.55)";
  ctx.beginPath(); ctx.ellipse(cx, cy, r.w/2 + 4, r.h/2 + 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#7B3FE4"; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(cx, cy, r.w/2, r.h/2, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = "#D9C8FF"; ctx.lineWidth = 2.5;
  for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.ellipse(cx, cy, (r.w/2 - 5)*(1 - i*0.28), (r.h/2 - 6)*(1 - i*0.28), 0, t + i*1.7, t + i*1.7 + 3.4); ctx.stroke(); }

}
function drawDoor(D){

  ctx.fillStyle = "#FFE2A8"; ctx.fillRect(D.x, D.y, D.w, D.h);
  ctx.fillStyle = "#F7B65A"; ctx.fillRect(D.x + 4, D.y + 6, D.w - 8, D.h - 10);
  ctx.fillStyle = "#1A2747"; ctx.beginPath(); ctx.arc(D.x + D.w - 8, D.y + D.h/2 + 4, 3, 0, Math.PI*2); ctx.fill();

function drawPlayer(){

function draw(){

    if (e.portals) for (const p of e.portals){ if (p.on) drawPortal(p.r, p.exit); }

  const b = $(id);

  const up = e => { keys[k] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", down); b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
  b.addEventListener("contextmenu", e => e.preventDefault());
}

    const b = document.createElement("button"); b.className = "world"; b.disabled = !open;

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
function updFs(){ const on = !!fsEl(); $("fsBtn").classList.toggle("on", on); $("fsBtn2").textContent = on ? "⛶ Выйти из полного экрана" : "⛶ На весь экран"; }
async function toggleFs(){
  const fail = () => toast("Полный экран тут не работает. Поверни телефон боком 📱", 3500);
  try {
    if (fsEl()){ if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); }
    else {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI:"hide" });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else return fail();
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch(e){}
      setTimeout(() => { if (!fsEl()) fail(); }, 700);
    }
  } catch(e){ fail(); }
}
